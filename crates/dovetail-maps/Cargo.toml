[package]
name = "dovetail-maps"
description = "Dovetail's visual maps: the map model and draw_map input validation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dovetail-api.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Decision 23c / S5: the renderer for structure maps. Flowchart + ELK layout + PNG only; no other
# diagram families. Heavy (105 new crates, ~14 MB of binary; merman-elk-layered is EPL-2.0, so its
# notice must ship) but contained here: dovetail-tui never depends on this crate. Pinned because
# merman is pre-1.0 and 0.10 is in alpha.
merman = { version = "=0.9.3", default-features = false, features = ["diagram-flowchart", "layout-elk", "png"] }
# M15 (f): rasterises the swimlane map's SVG (decision 23e: Dovetail draws swimlanes itself). No
# new crates: the same version and features merman's PNG export already pulls in.
resvg = { version = "=0.47.0", default-features = false, features = ["text", "system-fonts"] }

[dev-dependencies]
insta.workspace = true
# Tests decode the PNG to count highlight pixels.
png = "0.18"

[lints]
workspace = true
