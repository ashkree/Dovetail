[package]
name = "dovetail-tui"
description = "Dovetail's terminal UI: buffers, regions, keymap, theme and rendering"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The only Dovetail crate here is the API: Cargo itself keeps the UI from reaching past the core boundary.
[dependencies]
dovetail-api.workspace = true
crossterm.workspace = true
jiff.workspace = true
nucleo.workspace = true
pulldown-cmark.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
ratatui.workspace = true
tracing.workspace = true
unicode-width.workspace = true

[dev-dependencies]
insta.workspace = true
# Already a workspace dev-dependency: temp folders for saved paste images in tests.
tempfile.workspace = true

[lints]
workspace = true
