<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop · preview</title>
<!-- A stand-in for a slice's web preview (plan F7). The GUI posts the chosen variants; this page
     changes its theme, layout, header, footer and hero line to match. No network, no timers. -->
<link rel="stylesheet" href="sample.css">
</head>
<body>
<div class="site t0" id="site">
  <header class="h0" id="header">
    <span class="logo">SHOP</span>
    <nav><span>New</span><span>Women</span><span>Men</span><span>Home</span></nav>
    <span class="tog" id="tog">Dark mode: on</span>
  </header>
  <div class="hero" id="hero">Find something good.</div>
  <div class="grid" id="grid">
    <div class="prod">Wool scarf</div><div class="prod">Desk lamp</div><div class="prod">Canvas bag</div>
    <div class="prod">Mug set</div><div class="prod">Boots</div><div class="prod">Throw</div>
  </div>
  <footer id="footer">© Shop · Shipping · Returns</footer>
</div>
<script src="sample.js"></script>
</body>
</html>
