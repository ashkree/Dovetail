[workspace]
resolver = "3"
members = ["crates/*"]
# Spikes are throwaway packages with their own manifests.
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
dovetail-api = { path = "crates/dovetail-api" }
dovetail-core = { path = "crates/dovetail-core" }
dovetail-driver = { path = "crates/dovetail-driver" }
# Structure map to Mermaid/PNG/node positions (map canvas); shared by core, mock and binary.
dovetail-maps = { path = "crates/dovetail-maps" }
dovetail-mock = { path = "crates/dovetail-mock" }
dovetail-tui = { path = "crates/dovetail-tui" }
anyhow = "1"
crossterm = "0.29"
insta = "1"
jiff = "0.2"
nucleo = "0.5"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }
rusqlite = { version = "0.41", features = ["bundled"] }
# Safe wrappers for process/foreground-group syscalls (foreground.rs) without `unsafe`.
rustix = { version = "1", default-features = false, features = ["std", "process"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "net", "sync", "time", "macros"] }
toml = "1"
# TypeScript declarations of dovetail-api for the page (ADR 0030 §4); 64-bit ints as `number`.
ts-rs = { version = "12", default-features = false, features = ["serde-compat", "serde-json-impl", "no-serde-warnings"] }
notify = { version = "8", default-features = false }
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
